name: Uptime check

# PulseCheck (https://pulsecheck-shivam.fly.dev) is a dead-man's-switch
# monitor — it only knows something's wrong when an expected ping stops
# arriving. The site itself can't ping anything on its own (it's static),
# so this workflow is the "job" PulseCheck actually watches: it checks the
# live site on a schedule and only pings PulseCheck when the check passes.
# If the site goes down, pings stop, and PulseCheck emails an alert once
# its window elapses.

on:
  # Schedule paused: PulseCheck's Fly.io machines (worker + Postgres) are
  # stopped to cut hosting cost, so pings here would just fail every 15
  # minutes for no reason. Re-enable the schedule line once PulseCheck is
  # running again. workflow_dispatch is kept so it can still be run by hand.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check portfolio is up, ping PulseCheck if so
        env:
          # Set via: repo Settings → Secrets and variables → Actions → New
          # repository secret, named PULSECHECK_PING_URL. Was previously
          # hardcoded here — moved to a secret so the ping URL (which anyone
          # could otherwise replay to fake a healthy check) isn't sitting in
          # a public repo in plain text.
          PULSECHECK_PING_URL: ${{ secrets.PULSECHECK_PING_URL }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://shivam-portfolio-gold-omega.vercel.app/)
          echo "Portfolio responded with HTTP $code"
          if [ "$code" = "200" ]; then
            curl -fsS "$PULSECHECK_PING_URL"
          else
            echo "Not pinging PulseCheck — site did not return 200"
            exit 1
          fi
